# Package lists for the git-* subcommands, split into three tiers that
# answer different questions at different points in the pipeline. Conflating
# them made it impossible to tell whether a listed package is genuinely
# needed by every MySQL version on an OS, or just happened to be needed once
# and got left in a shared list -- see git history for the single flat
# `packages:` list this replaced.
#
# oses.<os>.minimal_git_packages
#   Tier 2: universal tooling needed for ANY MySQL git tag's `cmake
#   configure` to run on this OS, before any real mysql.spec exists to run
#   yum-builddep against -- there is no spec to derive this list from at
#   this point, so it can't be auto-determined. Same for every tag on this
#   OS; if a package here turns out to only be needed by some tags, move it
#   to src_rpm_build_packages instead.
#
#   libaio-devel is a hard `cmake configure` requirement on Linux (see
#   cmake/build_configurations/mysql_release.cmake), not an optional
#   feature quietly skipped when absent. The rest mirrors the official
#   spec's non-packaging-only BuildRequires (skipping patchelf/dwz/
#   annobin*/elfutils, which matter only for binary-RPM stripping, not for
#   cmake configure or `rpmbuild -bs`).
#
# oses.<os>.builds.<tag>.src_rpm_build_packages
#   Tier 3: this specific tag's own `cmake configure` needs, on top of
#   minimal_git_packages -- used by both git-build-src-rpm and
#   git-build-rpms, since both run `cmake configure` before either
#   produces anything. The one thing empirically found to vary per MySQL
#   release rather than per OS is the compiler toolchain (see below).
#
# oses.<os>.builds.<tag>.all_rpms_extra_packages
#   Tier 4: patches a gap in this tag's spec's own declared `BuildRequires:`
#   -- used only by git-build-rpms's BuildDeps step (`yum-builddep` against
#   the real, cmake-rendered spec), never by git-build-src-rpm, since `-bs`
#   only assembles a source tarball + spec and never evaluates
#   BuildRequires at all. Empty until a real gap is found; don't
#   pre-populate speculatively -- same reactive, verify-first discipline as
#   the compiler-toolset entries below.
#
# oses.<os>.builds.<tag>.patches
#   Unrelated to the four tiers above: bare filenames (no path component)
#   applied via `git apply` against the freshly cloned tree from
#   config/git-patches/<tag>/, in list order, before `cmake configure` runs
#   -- so a patch to packaging/rpm-oel/mysql.spec.in affects the spec cmake
#   renders. Shared by git-build-src-rpm and git-build-rpms. See
#   REFERENCE.md for how this differs from build-one's SPECS/SOURCES
#   patching (different target file, different patch format).
#
# On gcc/compiler packages: Oracle picks a newer gcc-toolset (not the base
# OS's static one) to build with on el8/el9, because MySQL major versions
# ship faster than the base OS's compiler does -- and which gcc-toolset
# version is needed is a property of the MySQL release being built, NOT of
# the OS: different MySQL versions have depended on different gcc-toolset
# generations over time (anywhere from ~10 through the current one), which
# is exactly why this is a per-tag entry and not part of minimal_git_packages
# above. Determine which one empirically per tag rather than guessing: an
# el8/el9 `cmake configure` run with no gcc-toolset installed at all fails
# with an explicit, actionable error naming the exact one needed --
#
#   CMake Warning at CMakeLists.txt:395 (MESSAGE):
#     Could not find devtoolset compiler/linker in /opt/rh/gcc-toolset-<N>
#   CMake Error at CMakeLists.txt:399 (MESSAGE):
#     Or you can set CMAKE_C_COMPILER and CMAKE_CXX_COMPILER explicitly.
#
# -- because MySQL's own CMakeLists.txt hard-requires a devtoolset compiler
# there (detected via `rpm -qf /`, checked directly against that specific
# /opt/rh/gcc-toolset-<N> path), not just a generic "is the compiler
# working" probe -- confirmed true on ol9/mysql-9.7.1 (needs gcc-toolset-14),
# and confirmed NOT the case on ol10 at all (no gcc-toolset dir there,
# configure succeeds with the base repo's plain gcc). Since CMakeLists.txt
# checks that specific path itself (not generic PATH lookup), installing the
# packages named in the error is sufficient -- no explicit compiler
# activation (PATH/CC/CXX/scl enable) needed in go/gitsteps.
oses:
  ol8:
    minimal_git_packages: [bison, cmake, cyrus-sasl-devel, git, krb5-devel, libaio-devel,
      libcurl-devel, libfido2-devel, libquadmath-devel, libtirpc-devel,
      libudev-devel, make, ncurses-devel, numactl-devel, openldap-devel,
      openssl-devel, pkgconfig(systemd), rpcgen, rpm-build, systemd, yum-utils]
    builds:
      # Confirmed empirically 2026-07-27 per this file's header-comment
      # method: an empty-list run's CMake error named these five exactly --
      # gcc-toolset-12, matching the legacy shell-script build
      # (config/ossetup/centos8__8.3.0+.sh, git history only -- covered
      # centos8/ol8 8.4.4-8.4.6) and the same toolset ol9/mysql-8.0.46 and
      # ol9/mysql-8.4.10 landed on above.
      mysql-8.4.7:
        src_rpm_build_packages: [gcc-toolset-12-annobin-annocheck,
          gcc-toolset-12-annobin-plugin-gcc, gcc-toolset-12-binutils,
          gcc-toolset-12-gcc, gcc-toolset-12-gcc-c++]
      # Confirmed empirically 2026-07-29 per this file's header-comment
      # method (git-configure's CMake error named these five exactly) --
      # same gcc-toolset-14 as ol9's "26.7.0" entry. Keyed "26.7.0" (not
      # "mysql-26.7.0") for the same reason as ol9's entry: this is the
      # exact -o/positional tag value used, decoupled from the actual git
      # ref via -repo/-ref (built from the bug/120895 fork branch).
      26.7.0:
        src_rpm_build_packages: [gcc-toolset-14-annobin-annocheck,
          gcc-toolset-14-annobin-plugin-gcc, gcc-toolset-14-binutils,
          gcc-toolset-14-gcc, gcc-toolset-14-gcc-c++]
      # WIP experimental rpm build of villagesql fork.
      # Same source as ol10's entry below. gcc-toolset-12 confirmed by
      # an empty-list run's CMake error, same as mysql-8.4.7 above.
      # This fails to build. The nested vsql_simple_extension
      # ExternalProject_Add sub-build doesn't inherit the parent
      # build's compiler choice, and falls back to el8's stock GCC
      # 8.5, which has no working C++ compiler.
      8.4.10-villagesql-0.0.5:
        patches: [000.fix-illegal-dash-in-release.patch,
                  001.villagesql-naming-and-dead-code.patch,
                  002.fix-inet-ntop-buffer-size.patch,
                  003.add-missing-villagesql-files.patch]
        src_rpm_build_packages: [gcc-toolset-12-annobin-annocheck,
          gcc-toolset-12-annobin-plugin-gcc, gcc-toolset-12-binutils,
          gcc-toolset-12-gcc, gcc-toolset-12-gcc-c++]
  ol9:
    minimal_git_packages: [bison, cmake, cyrus-sasl-devel, git, krb5-devel, libaio-devel,
      libcurl-devel, libfido2-devel, libquadmath-devel, libtirpc-devel,
      libudev-devel, make, ncurses-devel, numactl-devel, openldap-devel,
      openssl-devel, pkgconfig(systemd), rpcgen, rpm-build, systemd, yum-utils]
    builds:
      mysql-9.7.1:
        src_rpm_build_packages: [gcc-toolset-14-annobin-annocheck,
          gcc-toolset-14-annobin-plugin-gcc, gcc-toolset-14-binutils,
          gcc-toolset-14-gcc, gcc-toolset-14-gcc-c++]
      # Confirmed empirically 2026-07-29 per this file's header-comment
      # method (git-configure's CMake error named these five exactly) --
      # same gcc-toolset-14 as mysql-9.7.1. Keyed "26.7.0" (not
      # "mysql-26.7.0") because that's the exact -o/positional tag value
      # used for this build (see go/gitsteps.Runner.Tag: a version label,
      # decoupled from the actual git ref via -repo/-ref -- e.g. this
      # version was built from the bug/120895 fork branch, not a real
      # "mysql-26.7.0" tag).
      26.7.0:
        src_rpm_build_packages: [gcc-toolset-14-annobin-annocheck,
          gcc-toolset-14-annobin-plugin-gcc, gcc-toolset-14-binutils,
          gcc-toolset-14-gcc, gcc-toolset-14-gcc-c++]
      # Confirmed by testing that the following packages are needed
      # for the build to generate a src rpm.
      mysql-8.0.46:
        src_rpm_build_packages: [gcc-toolset-12-annobin-annocheck,
          gcc-toolset-12-annobin-plugin-gcc, gcc-toolset-12-binutils,
          gcc-toolset-12-gcc, gcc-toolset-12-gcc-c++]
      # Confirmed empirically 2026-07-25 per this file's header-comment
      # method: an empty-list run's CMake error named these five exactly --
      # same gcc-toolset-12 as 8.0.46 (8.4 is the direct LTS successor to
      # the 8.0 branch, so this isn't too surprising in hindsight, but it
      # was still verified rather than assumed).
      mysql-8.4.10:
        src_rpm_build_packages: [gcc-toolset-12-annobin-annocheck,
          gcc-toolset-12-annobin-plugin-gcc, gcc-toolset-12-binutils,
          gcc-toolset-12-gcc, gcc-toolset-12-gcc-c++]
      # WIP experimental rpm build of villagesql fork.
      # Same source as ol10's entry below. Full RPM build from
      # generated src rpm succeeds.
      8.4.10-villagesql-0.0.5:
        patches: [000.fix-illegal-dash-in-release.patch,
                  001.villagesql-naming-and-dead-code.patch,
                  002.fix-inet-ntop-buffer-size.patch,
                  003.add-missing-villagesql-files.patch]
        src_rpm_build_packages: [gcc-toolset-12-annobin-annocheck,
          gcc-toolset-12-annobin-plugin-gcc, gcc-toolset-12-binutils,
          gcc-toolset-12-gcc, gcc-toolset-12-gcc-c++]
  ol10:
    minimal_git_packages: [bison, cmake, cyrus-sasl-devel, gcc, gcc-c++, git, krb5-devel,
      libaio-devel, libcurl-devel, libfido2-devel, libquadmath-devel,
      libtirpc-devel, libudev-devel, make, ncurses-devel, numactl-devel,
      openldap-devel, openssl-devel, pkgconfig(systemd), rpcgen, rpm-build,
      systemd, yum-utils]
    builds:
      # WIP experimental rpm build of villagesql fork.
      # villagesql-server (github.com/villagesql/villagesql-server), tag
      # 0.0.5, MySQL 8.4.10 base. Full RPM build from generated src rpm
      # succeeds, no extra packages needed beyond minimal_git_packages.
      8.4.10-villagesql-0.0.5:
        patches: [000.fix-illegal-dash-in-release.patch,
                  001.villagesql-naming-and-dead-code.patch,
                  002.fix-inet-ntop-buffer-size.patch,
                  003.add-missing-villagesql-files.patch]

      # Real upstream tag (not the ol8/ol9 "26.7.0" entries above, which
      # are keyed to the -repo/-ref-overridden bug/120895 fork branch, not
      # this actual mysql-26.7.0 release). Bug report test case: vanilla
      # Oracle MySQL, packaging/rpm-oel/mysql.spec.in's %package test
      # never declares Requires: perl(lib)/openssl, so mysql-test-run.pl
      # fails on a minimal install (Can't locate lib.pm; openssl
      # feature-detection). Confirmed identical, unfixed, on 8.4.11,
      # 9.7.2, 26.7.0, and trunk. Already built clean once with zero
      # extra packages (built/git-build-rpms/ol10__mysql-26.7.0/), so no
      # src_rpm_build_packages needed here either.
      mysql-26.7.0:
        patches: [000.fix-missing-test-package-requires.patch]
