# Build definitions for the MySQL rpm builder, configured by OS / MySQL version.
#
# Each entry is fully explicit for each OS / MySQL version combination.
# Ideally when a new version of MySQL is released you can use the settings
# from the previously built version. Sometimes this needs tweaking.
#
# The base tooling every build needs (wget, rpm-build) is installed
# unconditionally by the program, so it never needs listing here.
#
# Per-build fields:
#   srpm                        (required) URL of the source RPM to build.
#   auto_install_dependencies   (required) true/false. When true, the
#                               install-builddeps step runs yum-builddep against
#                               the extracted mysql.spec to resolve its
#                               BuildRequires (yum-utils is installed first as it
#                               provides yum-builddep).
#   packages                    (optional) explicit packages installed as root
#                               before the build. Not needed when
#                               auto_install_dependencies resolves everything if
#                               BuildRequires: is configured correctly.
#
# At least one of auto_install_dependencies or packages must be set.
oses:
  #
  # Alma Linux
  #
  almalinux9:
    builds:
      9.7.1:
        # auto_install_dependencies: true is insufficient
        # - see https://bugs.mysql.com/bug.php?id=120895
        srpm: https://dev.mysql.com/get/Downloads/MySQL-9.0/mysql-community-9.7.1-1.el9.src.rpm
        packages: [libfido2-devel, libudev-devel]
        auto_install_dependencies: true

  almalinux10:
    builds:

  #
  # CentOS
  #

  #
  # Oracle Linux
  #

  ol8:
    builds:
      8.4.7:
        # mysql.spec's BuildRequires covers everything else for el8 (resolved
        # via auto_install_dependencies/yum-builddep). These three are needed
        # to build but missing from the spec's el8 BuildRequires:
        #  - cpp: rpcgen shells out to the system C preprocessor to generate
        #    xdr_gen/xcom_vp.h; without it rpcgen fails silently and xcom
        #    fails to compile (undefined app_data_ptr et al).
        #  - libfido2-devel, libudev-devel: the spec enables add_fido_plugins
        #    for rhel>=8 but only declares these BuildRequires under
        #    %if 0%{?rhel} == 10, so el8 needs them added explicitly.
        srpm: https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-community-8.4.7-1.el8.src.rpm
        auto_install_dependencies: true
        packages: [cpp, libfido2-devel, libudev-devel]

  ol9:
    builds:
      # auto_install_dependencies: true is insufficient
      # - see https://bugs.mysql.com/bug.php?id=120895
      8.4.10:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-community-8.4.10-1.el9.src.rpm
        packages: [libfido2-devel, libudev-devel]
        auto_install_dependencies: true

      # auto_install_dependencies: true is insufficient
      # - see https://bugs.mysql.com/bug.php?id=120895
      9.7.1:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-9.0/mysql-community-9.7.1-1.el9.src.rpm
        packages: [libfido2-devel, libudev-devel]
        auto_install_dependencies: true

      8.0.46-src-rpm-built-from-git:
        # Test building the src rpm which was built with: ./build-rpm-from-git -no-bison ol9 mysql-8.0.46
        srpm: file:///data/built-from-git/ol9__mysql-8.0.46/mysql-community-8.0.46-1.el9.src.rpm
        packages: [libfido2-devel, libudev-devel]
        auto_install_dependencies: true
      8.4.10-src-rpm-built-from-git:
        # Test building the src rpm which was built with: ./build-rpm-from-git -no-bison ol9 mysql-8.4.10
        srpm: file:///data/built-from-git/ol9__mysql-8.4.10/mysql-community-8.4.10-1.el9.src.rpm
        packages: [libfido2-devel, libudev-devel]
        auto_install_dependencies: true
      26.7.0:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-26.7/mysql-community-26.7.0-1.el9.src.rpm
        auto_install_dependencies: true
        packages: [libfido2-devel, libudev-devel]
  ol10:
    builds:
      8.4.7:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-community-8.4.7-1.el10.src.rpm
        auto_install_dependencies: true
      8.4.8:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-community-8.4.8-1.el10.src.rpm
        auto_install_dependencies: true
      8.4.9:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-community-8.4.9-1.el10.src.rpm
        auto_install_dependencies: true
      8.4.10:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-community-8.4.10-1.el10.src.rpm
        auto_install_dependencies: true

      9.7.1:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-9.0/mysql-community-9.7.1-1.el10.src.rpm
        auto_install_dependencies: true
      9.7.1-src-rpm-built-from-git:
        # Test building the src rpm which was built with: ./build-rpm-from-git -no-bison ol10 mysql-9.7.1
        srpm: file:///data/built-from-git/ol10__mysql-9.7.1/mysql-community-9.7.1-1.el10.src.rpm
        auto_install_dependencies: true
      26.7.0:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-26.7/mysql-community-26.7.0-1.el10.src.rpm
        auto_install_dependencies: true
      9.7.2:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-9.0/mysql-community-9.7.2-1.el10.src.rpm
        auto_install_dependencies: true
  #
  # Rocky Linux
  #
  rocky9:
    builds:
      # auto_install_dependencies: true is insufficient
      # - see https://bugs.mysql.com/bug.php?id=120895
      9.7.1:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-9.0/mysql-community-9.7.1-1.el9.src.rpm
        packages: [libfido2-devel, libudev-devel]
        auto_install_dependencies: true

  rocky10:
    builds:
      8.4.7:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-community-8.4.7-1.el10.src.rpm
        auto_install_dependencies: true
      8.4.10:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-community-8.4.10-1.el10.src.rpm
        auto_install_dependencies: true
      9.7.1:
        srpm: https://dev.mysql.com/get/Downloads/MySQL-9.0/mysql-community-9.7.1-1.el10.src.rpm
        auto_install_dependencies: true
